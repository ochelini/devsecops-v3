name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/user-api" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:

      # ✅ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ SCA - Scan dependencies (user + order)
      - name: SCA - npm audit
        run: |
          cd user-service
          npm install
          npm audit || true

          cd ../order-service
          npm install
          npm audit || true

      # ✅ Build Docker images
      - name: Build Docker images
        run: |
          docker build -t user-service ./user-service
          docker build -t order-service ./order-service

      # ✅ Scan Docker images (Trivy)
      - name: Scan Docker images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image user-service

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image order-service

      # ✅ Done
      - name: Pipeline finished
        run: echo "CI + Security checks completed ✅"
