name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/user-api

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SCA - npm audit
        run: |
          cd user-service
          npm install
          npm audit || true

          cd ../order-service
          npm install
          npm audit || true

      - name: Build Docker images
        run: |
          docker build -t user-service ./user-service
          docker build -t order-service ./order-service

      - name: Scan Docker images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image user-service

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image order-service

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          cat <<EOF > $HOME/.kube/config
          ${{ secrets.KUBE_CONFIG }}
          EOF

    - name: Setup Helm
      uses: azure/setup-helm@v3    

  - name: Deploy with Helm
        run: |
    helm upgrade --install user ./devsecops-chart \
      --set name=user-service \
      --set image.repository=user-service \
      --set image.tag=${{ github.sha }}

    helm upgrade --install order ./devsecops-chart \
      --set name=order-service \
      --set image.repository=order-service \
      --set image.tag=${{ github.sha }}
      - name: Finish
        run: echo "Pipeline completed ✅"
