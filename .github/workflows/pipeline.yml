name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/user-api" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ SCA - npm audit (user + order)
      - name: SCA - npm audit
        run: |
          cd user-service
          npm install
          npm audit || true

          cd ../order-service
          npm install
          npm audit || true

      # ✅ Build Docker images
      - name: Build Docker images
        run: |
          docker build -t user-service ./user-service
          docker build -t order-service ./order-service

      # ✅ Scan Docker images (Trivy)
      - name: Scan Docker images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image user-service

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image order-service

      # ✅ Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # ✅ Configure kubeconfig (BASE64 FIX)
      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
       - name: Verify kubeconfig
         run: |
          cat $HOME/.kube/config

      # ✅ Deploy to AKS
      - name: Deploy to AKS
        run: |
          kubectl apply -f user-deployment.yaml
          kubectl apply -f user-service.yaml
          kubectl apply -f order-deployment.yaml
          kubectl apply -f order-service.yaml

      # ✅ Done
      - name: Pipeline finished
        run: echo "CI + Security + Deployment completed ✅"
